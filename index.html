 var H=U.hist||[];if(H.length>1){var p=H[H.length-2],c=H[H.length-1];g+="<p>📊 منذ "+p.d+": "+dl(c.f,p.f,"متابع")+" · "+dl(c.l,p.l,"إعجاب")+" · "+dl(c.v,p.v,"فيديو")+(p.w!=null&&c.w!=null?" · "+dl(c.w,p.w,"مشاهدة")+" · "+dl(c.c,p.c,"تعليق"):"")+"</p>"}else g+="<p class=mu>حدّث أرقامك لاحقًا لترى تطور حسابك وإنجازاته.</p>";
